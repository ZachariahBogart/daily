<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily</title>
  <meta name="description" content="Today's daily games: what's left to play, one tap to start, and a streak for each.">
  <meta name="theme-color" content="#1C1D1F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C1D1F'/%3E%3Crect x='5' y='5' width='10' height='10' rx='2' fill='%232F9E57'/%3E%3Crect x='17' y='5' width='10' height='10' rx='2' fill='%23E0A82E'/%3E%3Crect x='5' y='17' width='10' height='10' rx='2' fill='%232F9E57'/%3E%3Crect x='17' y='17' width='10' height='10' rx='2' fill='%23F6F7F5'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="wrap top">
      <h1 class="brand">
        <svg class="mark" viewBox="0 0 34 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="#2F9E57"/><rect x="12" width="10" height="10" rx="2" fill="#E0A82E"/><rect x="24" width="10" height="10" rx="2" fill="#F6F7F5"/></svg>
        Daily
      </h1>
      <p class="date" id="date"></p>
      <p class="left" id="left" aria-live="polite"></p>
      <div class="tally" id="tally" aria-hidden="true"></div>
    </div>
    <div class="wrap find">
      <label class="field">
        <span class="sr">Search games</span>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search games or sites" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <nav class="wrap chips" id="chips" aria-label="Categories"></nav>
  </header>

  <main class="wrap" id="main">
    <div id="notices"></div>

    <form class="sheet" id="form" hidden novalidate>
      <h2 id="form-title">Add a game</h2>
      <p class="note">Games you add are saved in this browser only.</p>
      <label>Name <input name="name" maxlength="40" autocomplete="off" required></label>
      <label>Link <input name="url" inputmode="url" autocomplete="off" placeholder="krillion.io" required></label>
      <label>Category <input name="category" maxlength="24" list="cats" autocomplete="off" placeholder="Other"></label>
      <datalist id="cats"></datalist>
      <p class="err" id="form-err" role="alert"></p>
      <div class="actions">
        <button type="submit" class="btn solid">Save game</button>
        <button type="button" class="btn" id="cancel">Cancel</button>
      </div>
    </form>

    <div id="list"></div>
  </main>

  <noscript><p class="wrap">Daily needs JavaScript to show your games and streaks.</p></noscript>
  <script src="lib.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
